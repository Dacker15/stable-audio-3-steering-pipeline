[project]
name = "acestep-steering-pipeline"
version = "0.2.0"
description = "Target-specific differentiable steering for ACE-Step 1.5 SFT"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # ACE-Step 1.5's remote modeling code relies on Transformers APIs removed
    # in 4.58+. Keep this interval aligned with the upstream project.
    "accelerate>=1.12.0,<2",
    "diffusers>=0.37.0",
    "einops>=0.8.1",
    "huggingface-hub>=0.36.0,<2",
    "loguru>=0.7.3",
    "matplotlib>=3.7.5",
    "numpy>=1.26,<3",
    "pytorch-wavelets>=1.3.0",
    "pywavelets>=1.9.0",
    "safetensors>=0.4.5",
    "scipy>=1.10.1",
    "setuptools<72",
    "soundfile>=0.13.1",
    # Match the official ACE-Step 1.5 CUDA builds on the two supported GPU
    # platforms. Other platforms remain useful for CPU-only unit tests.
    "torch==2.10.0+cu128; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torch==2.7.1+cu128; sys_platform == 'win32'",
    "torch>=2.9.1,<3; sys_platform == 'darwin'",
    "torch>=2.7.1,<3; sys_platform != 'linux' and sys_platform != 'win32' and sys_platform != 'darwin'",
    "torch>=2.7.1,<3; sys_platform == 'linux' and platform_machine != 'x86_64'",
    "tqdm>=4.66.0",
    "transformers>=4.51.0,<4.58.0",
    "vector-quantize-pytorch>=1.27.15",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["losses", "pipelines", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
markers = [
    "diagnostic: opt-in integration diagnostic that loads external model weights or assets",
    "external_model: requires pretrained weights from an external model repository",
    "clap: exercises the external CLAP audio/text embedding model",
    "gpu: requires a CUDA GPU and may use substantial VRAM",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')" },
]
