[project]
name = "ace-step-1-5-steering-pipeline"
version = "0.1.0"
description = "Learned per-step concept steering for ACE-Step 1.5 SFT by interpolating full-prompt and retain-prompt APG predictions"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate>=1.14.0",
    "diffusers>=0.39.0",
    "einops>=0.8.2",
    "huggingface-hub>=0.34,<1.0",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "safetensors>=0.7.0",
    "soundfile>=0.13.1",
    # Keep the binary extensions on exactly the same release. ACE-Step's official Windows
    # environment uses this pair; open lower bounds can resolve mismatched nightly-era wheels.
    "torch==2.7.1",
    "torchaudio==2.7.1",
    "torchsde>=0.2.6",
    "tqdm>=4.67.3",
    # The official 2B SFT checkpoint ships Transformers custom code built against 4.57.
    "transformers>=4.57,<4.58",
    "vector-quantize-pytorch>=1.27.15",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'win32' or platform_machine != 'AMD64'" },
]
torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'win32' or platform_machine != 'AMD64'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'win32' or platform_machine != 'AMD64'" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["losses", "pipelines", "utils"]
